<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spine Clone — Editor</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>
  <body>
    <header id="app-header">
      <strong>🦴 Spine Clone</strong>
      <span id="project-name" class="muted">Untitled</span>
      <div id="toolbar">
        <button id="btn-new" title="New project">📄 New</button>
        <button id="btn-load-image" title="Load image as atlas page">🖼 Load Image</button>
        <button id="btn-load-spine" title="Open Spine project — pick .spine-json + .atlas + .png together">🦴 Open Spine</button>
        <button id="btn-load-project" title="Open .spineclone.json project">📂 Open</button>
        <button id="btn-save" title="Save .spineclone.json">💾 Save</button>
        <button id="btn-export-spine" title="Export Spine 4.x JSON (compat any spine-runtime)">📤 Export Spine</button>
        <button id="btn-load-sample" title="Load demo sprite (for testing)">🎁 Demo</button>
      </div>
      <div id="mode-switcher">
        <button id="btn-mode-atlas" class="mode-btn">🎨 Atlas</button>
        <button id="btn-mode-pose" class="mode-btn active">🦴 Pose</button>
      </div>
    </header>

    <main id="app-main">
      <aside id="app-left">
        <div class="panel-section">
          <h3>Hierarchy</h3>
          <div class="panel-actions">
            <button id="btn-add-bone" class="sm-btn" title="Add child bone">+ Bone</button>
            <button id="btn-add-slot" class="sm-btn" title="Add slot to selected bone">+ Slot</button>
            <button id="btn-delete-item" class="sm-btn" title="Delete selected item">✕</button>
          </div>
          <ul id="hierarchy-tree" class="tree"></ul>
        </div>
        <div class="panel-section">
          <h3>Modules (atlas regions)</h3>
          <div class="panel-actions">
            <span id="module-count" class="muted">0 modules</span>
          </div>
          <ul id="module-list" class="tree"></ul>
        </div>
        <div class="panel-section">
          <h3>Animations</h3>
          <div class="panel-actions">
            <button id="btn-add-anim" class="sm-btn">+ Anim</button>
            <button id="btn-delete-anim" class="sm-btn">✕</button>
          </div>
          <ul id="animation-list" class="tree"></ul>
        </div>
      </aside>

      <section id="app-canvas-wrap">
        <div id="canvas-host"></div>
        <div id="canvas-tools">
          <div id="atlas-tools" style="display:none;">
            <span class="muted">Atlas mode:</span>
            <button id="btn-draw-region" class="sm-btn active">📐 Draw Region</button>
            <button id="btn-select-region" class="sm-btn">↖ Select</button>
            <span class="muted">| Drag chuột trên ảnh để tạo region mới</span>
          </div>
          <div id="pose-tools">
            <label>Time
              <input id="time-slider" type="range" min="0" max="1000" step="10" value="0" />
              <span id="time-val">0ms</span>
            </label>
            <button id="btn-play" title="Play/Pause">▶</button>
            <label>Scale
              <input id="scale-slider" type="range" min="0.2" max="3" step="0.05" value="1" />
              <span id="scale-val">1.00</span>
            </label>
          </div>
        </div>
      </section>

      <aside id="app-right">
        <h3>Properties</h3>
        <div id="props-panel">
          <p class="muted" id="props-empty">Nothing selected</p>
          <div id="props-content"></div>
        </div>
      </aside>
    </main>

    <footer id="app-footer">
      <span id="status-msg" class="muted">Ready</span>
      <span id="status-stats" class="muted"></span>
    </footer>

    <!-- Debug overlay — visible without F12 -->
    <div id="debug-overlay">
      <div id="debug-header">
        <strong>🐛 Debug log</strong>
        <button id="debug-clear">Clear</button>
        <button id="debug-toggle">▼</button>
      </div>
      <div id="debug-log"></div>
    </div>

    <!-- File pickers handled by src/io/fileApi.ts (Tauri native dialog or browser fallback) -->
  </body>
</html>
